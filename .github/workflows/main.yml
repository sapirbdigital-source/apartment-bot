name: Sapir Apartment Bot

on:
  schedule:
    # פעם ביום בבוקר. שעון UTC: 05:00 = 08:00 בקיץ (UTC+3), 07:00 בחורף (UTC+2).
    #
    # למה פעם ביום ולא פעמיים: ה-Task ב-Apify מוגדר להחזיר פוסטים מ-24 השעות
    # האחרונות (onlyPostsNewerThan). הרצה שנייה באותו יום תסרוק שוב את אותו
    # חלון ותשלם עליו פעם נוספת — הזיכרון שלנו חוסך את עלות ה-AI, לא את Apify.
    - cron: '0 5 * * *'
  workflow_dispatch:

# שתי הרצות במקביל ידרסו אחת את השנייה ב-seen.json
concurrency:
  group: apartment-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # נדרש כדי לשמור בחזרה את data/seen.json
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          APIFY_TOKEN_1:   ${{ secrets.APIFY_TOKEN_1 }}
          APIFY_TASK_ID_1: ${{ secrets.APIFY_TASK_ID_1 }}
          APIFY_TOKEN_2:   ${{ secrets.APIFY_TOKEN_2 }}
          APIFY_TASK_ID_2: ${{ secrets.APIFY_TASK_ID_2 }}
          APIFY_TOKEN_3:   ${{ secrets.APIFY_TOKEN_3 }}
          APIFY_TASK_ID_3: ${{ secrets.APIFY_TASK_ID_3 }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          # מייל — ערוץ ראשי
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO:      ${{ secrets.EMAIL_TO }}
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_PORT:     ${{ secrets.SMTP_PORT }}
          # ntfy — פוש לנייד
          NTFY_TOPIC:  ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          # וואטסאפ / טלגרם — גיבויים
          WHATSAPP_TO:           ${{ secrets.WHATSAPP_TO }}
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN:       ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_URL:         ${{ secrets.GREEN_API_URL }}
          CALLMEBOT_APIKEY:      ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_TOKEN:        ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python bot.py

      # שומר את זיכרון הכפילויות. כבונוס — כל קומיט כזה מחדש את
      # מד ה-60-יום של GitHub, כך שה-schedule לא יושבת אוטומטית.
      - name: Persist seen.json
        if: always()
        run: |
          git config user.name  "apartment-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/seen.json
          git diff --staged --quiet || git commit -m "chore: update seen listings [skip ci]"
          git push
